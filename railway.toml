[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Escalabilidad horizontal — Railway Pro permite múltiples réplicas
# Para activar: Railway Dashboard → Settings → Replicas → aumentar
# Con Redis+BullMQ el queue se distribuye automáticamente entre instancias
# healthcheckPath desactivado — el servidor gestiona su propio estado
# Railway bloqueaba deploys por timeout en el healthcheck
# healthcheckPath = "/api/health"

[[deploy.envVars]]
# Workers paralelos por instancia (BullMQ)
name = "JOB_CONCURRENCY"
default = "10"

[[deploy.envVars]]
# Réplicas mínimas recomendadas en producción
name = "MIN_REPLICAS"
default = "1"
