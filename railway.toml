# ── API Server (maris-ai-api-server) ─────────────────────────────────────────
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[deploy.envVars]]
name = "JOB_CONCURRENCY"
default = "10"

[[deploy.envVars]]
name = "MIN_REPLICAS"
default = "1"
