[build]
# Railway detecta automáticamente el Dockerfile en la raíz del repo.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/health"
# 300 segundos = 5 minutos para que MongoDB conecte y el servidor esté listo
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
