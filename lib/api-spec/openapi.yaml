openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user / credits
  - name: apps
    description: Generated apps
  - name: generation
    description: AI app generation
  - name: billing
    description: Credit purchase / Stripe
  - name: admin
    description: Admin-only operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile and credits
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/stats:
    get:
      operationId: getMyStats
      tags: [me]
      summary: Get dashboard summary stats for current user
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: List the current user's generated apps
      responses:
        "200":
          description: List of apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedApp"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Get a specific generated app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Delete a generated app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generate:
    post:
      operationId: generateApp
      tags: [generation]
      summary: Enqueue an app generation job (cost depends on kind — fullstack/landing/vue/svelte 1, mobile/nextjs 2, hybrid-pwa 3, game-2d 3, game-3d 5; free for admins). If appId is provided, edits the existing app instead of creating a new one (always 1 credit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAppRequest"
      responses:
        "202":
          description: Generation job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/messages:
    get:
      operationId: listAppMessages
      tags: [apps]
      summary: List chat messages for an app (oldest first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppMessage"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: sendAppMessage
      tags: [apps]
      summary: Send a chat message that triggers an iterative regeneration of the app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAppMessageRequest"
      responses:
        "200":
          description: Message answered directly without enqueuing a job (questions, web research)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendAppMessageDirectResponse"
        "202":
          description: Edit job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/notes:
    get:
      operationId: getAppNotes
      tags: [apps]
      summary: Get the agent's persistent notes for an app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNotes"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAppNotes
      tags: [apps]
      summary: Replace the agent's persistent notes for an app (max 3000 chars)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentNotes"
      responses:
        "200":
          description: Updated notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNotes"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [me]
      summary: Get the user's cross-app preferences (memory layer #3)
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNotes"
    put:
      operationId: updateMyPreferences
      tags: [me]
      summary: Replace the user's cross-app preferences (max 3000 chars)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentNotes"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNotes"
  /apps/{id}/revisions:
    get:
      operationId: listAppRevisions
      tags: [apps]
      summary: List the revision history (snapshots) of an app, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revision list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRevisionList"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/revisions/{revisionId}/restore:
    post:
      operationId: restoreAppRevision
      tags: [apps]
      summary: Restore an app to a previous revision (current state saved as backup)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: revisionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: App or revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /templates:
    get:
      operationId: listTemplates
      tags: [apps]
      summary: List curated starter templates the dashboard can show as cards
      responses:
        "200":
          description: Template catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
  /apps/{id}/deploy/vercel:
    post:
      operationId: deployAppToVercel
      tags: [apps]
      summary: Push the app to the user's Vercel account as a static deploy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deployment URL on Vercel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VercelDeployResult"
        "400":
          description: Bundle could not be compiled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Vercel rejected the deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: VERCEL_TOKEN not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/domain:
    get:
      operationId: getAppCustomDomain
      tags: [apps]
      summary: Read the current custom Vercel domain for the app (with verification status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain status (or null if not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomainStatus"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: attachAppCustomDomain
      tags: [apps]
      summary: Attach a custom domain to the app's Vercel project (paid-plan only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  description: Bare domain name like "mitienda.com" or "www.mitienda.com"
      responses:
        "200":
          description: Domain attached, returns DNS instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomainStatus"
        "400":
          description: Invalid domain or app has not been deployed to Vercel yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: |
            Custom domain is locked. Free plan only allows the auto-assigned
            preview domain — paid plans unlock custom domains.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiError"
                  - type: object
                    properties:
                      unlocked:
                        type: boolean
                      unlockReason:
                        type: string
                        enum: ["admin", "purchase"]
                        nullable: true
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Vercel rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: VERCEL_TOKEN not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: detachAppCustomDomain
      tags: [apps]
      summary: Detach the custom domain from the app's Vercel project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain detached
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Vercel rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/model:
    patch:
      operationId: updateAppModel
      tags: [apps]
      summary: Update the Coder model preference for an app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoderModelRequest"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "400":
          description: Invalid model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/auto-publish:
    patch:
      operationId: updateAppAutoPublish
      tags: [apps]
      summary: Toggle the auto-publish flag for an app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoPublishRequest"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "400":
          description: Invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/retry-generation:
    post:
      operationId: retryAppGeneration
      tags: [apps]
      summary: Re-trigger generation for an app stuck in needs_review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Retry job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: App is not in needs_review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/export:
    get:
      operationId: exportApp
      tags: [apps]
      summary: Download the app source as a ZIP archive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ZIP archive of the app source
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/generate-images:
    post:
      operationId: generateAppImages
      tags: [apps]
      summary: Replace placeholder image URLs in the app bundle with real Nano Banana Pro images
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResult"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Image generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/healthcheck:
    post:
      operationId: healthCheckApp
      tags: [apps]
      summary: Validate the app bundle and auto-patch any detected issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResult"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/deploy:
    post:
      operationId: deployApp
      tags: [apps]
      summary: Publish the app to a public /p/{slug} URL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "400":
          description: Bundle could not be packaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/fork:
    post:
      operationId: forkApp
      tags: [apps]
      summary: Clone the app (frontend + backend code, model, language) into a brand-new app owned by the current user. Free — no credits charged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The newly-created copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/visual-test:
    post:
      operationId: visualTestApp
      tags: [apps]
      summary: Run the Visual Testing Agent (screenshots + Claude Vision + auto-fix). Costs 30 credits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Visual analysis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualTestReport"
        "400":
          description: Bundle could not be packaged for screenshotting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Visual testing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/runtime-errors:
    get:
      operationId: listAppRuntimeErrors
      tags: [apps]
      summary: List recent JavaScript errors reported from the published app's iframe
      description: |
        Owner-only. Returns up to the last 50 runtime errors captured by the
        published app sandbox (`window.error` and `window.unhandledrejection`).
        Used by the panel to show the user when a real visitor hit a blank
        page, so they can regenerate the app.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recent runtime errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRuntimeErrorList"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearAppRuntimeErrors
      tags: [apps]
      summary: Discard all stored runtime errors for this app
      description: |
        Owner-only. Used after the user regenerates or fixes the app and
        wants to dismiss the error notice in the panel.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/github:
    post:
      operationId: pushAppToGitHub
      tags: [apps]
      summary: |
        Push the app source to GitHub. Idempotent: the FIRST push creates a
        new public repo under the connected account; subsequent pushes add
        a fresh commit on `main` to the same repo (replacing the file tree
        with the current snapshot, so deleted files are also removed).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: GitHub repo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubPushResult"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generate/jobs/{id}:
    get:
      operationId: getGenerationJob
      tags: [generation]
      summary: Poll the status of a generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generate/jobs/{id}/logs:
    get:
      operationId: getGenerationJobLogs
      tags: [generation]
      summary: Stream live agent log lines for a job
      description: |
        Returns log lines emitted by individual agents (researcher, architect,
        designer, integration, coder, qa, validator, patcher, system) during
        the generation pipeline. Pass `afterId` to fetch only lines newer than
        the last id you've seen — the dashboard polls this endpoint every
        ~1.2s while a job is running so the user sees the agents' real-time
        output.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: afterId
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: New log lines since afterId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogList"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /billing/packages:
    get:
      operationId: listCreditPackages
      tags: [billing]
      summary: List available credit packages
      responses:
        "200":
          description: Available packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPackage"
  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session for a credit package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /billing/transactions:
    get:
      operationId: listTransactions
      tags: [billing]
      summary: List the current user's recent credit transactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTransaction"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /billing/confirm:
    post:
      operationId: confirmCheckout
      tags: [billing]
      summary: Confirm a Stripe checkout session and credit the user (called after redirect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCheckoutRequest"
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmCheckoutResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Global stats and recent activity for the admin panel
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with their stats
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{id}/credits:
    post:
      operationId: adjustUserCredits
      tags: [admin]
      summary: Add or remove credits from a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCreditsRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/apps:
    get:
      operationId: listAdminApps
      tags: [admin]
      summary: List all generated apps across all users
      responses:
        "200":
          description: List of apps with owner info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminApp"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin]
      summary: Recent generation jobs across all users (queue health view)
      responses:
        "200":
          description: List of jobs with owner info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobsResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/jobs/{id}/retry:
    post:
      operationId: retryAdminJob
      tags: [admin]
      summary: Re-enqueue a failed (or stuck) generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job re-enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Job is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        credits:
          type: integer
        appsGenerated:
          type: integer
        isAdmin:
          type: boolean
        isPremium:
          type: boolean
        lifetimeCreditsPurchased:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - credits
        - appsGenerated
        - isAdmin
        - createdAt
    DashboardStats:
      type: object
      properties:
        credits:
          type: integer
        appsGenerated:
          type: integer
        appsThisWeek:
          type: integer
        creditsSpentTotal:
          type: integer
        recentApps:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedApp"
      required:
        - credits
        - appsGenerated
        - appsThisWeek
        - creditsSpentTotal
        - recentApps
    GeneratedApp:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        prompt:
          type: string
        description:
          type: string
        techStack:
          type: array
          items:
            type: string
        frontendCode:
          type: string
        backendCode:
          type: string
        status:
          type: string
        coderModel:
          type: string
          description: "Coder model preference: auto | gemini-2.5-flash | claude-4-7-sonnet-20260416"
        language:
          type: string
          description: "Source language: typescript (.tsx) or javascript (.jsx). Locked at creation."
        publicSlug:
          type: string
          nullable: true
          description: When set, the app is publicly viewable at /p/{publicSlug}.
        githubRepoUrl:
          type: string
          nullable: true
          description: HTML URL of the repo this app was last pushed to.
        githubRepoFullName:
          type: string
          nullable: true
          description: |
            GitHub identifier in `owner/repo` form. Persisted so subsequent
            pushes update the same repo with a new commit on `main` instead
            of creating a new repo each time.
        vercelDeployUrl:
          type: string
          nullable: true
          description: Last public URL Vercel returned for this app, or null if never deployed there.
        vercelProjectId:
          type: string
          nullable: true
          description: Vercel project id this app is wired to (null until first deploy).
        vercelCustomDomain:
          type: string
          nullable: true
          description: Custom domain attached to the Vercel project, or null if none.
        autoPublish:
          type: boolean
          description: When true, the autonomous evaluator publishes successful generations to /p/{slug} automatically.
        evaluatorSummary:
          type: string
          nullable: true
          description: Spanish summary written by the evaluator when an app is in needs_review state.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - prompt
        - description
        - techStack
        - frontendCode
        - backendCode
        - status
        - coderModel
        - language
        - autoPublish
        - createdAt
    GenerateAppRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 5
        appId:
          type: integer
          nullable: true
          description: When provided, edits the existing app iteratively instead of creating a new one
        coderModel:
          type: string
          nullable: true
          description: "Coder model for the new app. One of: auto | gemini-2.5-flash | claude-4-7-sonnet-20260416. Ignored on edits."
        language:
          type: string
          nullable: true
          description: "Source language for the new app: typescript | javascript. Default typescript. Ignored on edits (the app's stored value wins)."
        kind:
          type: string
          nullable: true
          enum: [fullstack, mobile, landing, "game-2d", "game-3d", "hybrid-pwa", vue, svelte, nextjs, "python-api", django]
          description: "Project kind preset. Drives the architect's INTENT directive and the credit cost (fullstack/landing/vue/svelte 1, mobile/nextjs/python-api/django 2, hybrid-pwa 3, game-2d 3, game-3d 5). Python kinds (python-api/django) generate Python source code instead of JS — no in-browser preview, exporta a ZIP/GitHub o despliega a Vercel. Ignored on edits — they always cost 1 credit and inherit the app's original characteristics."
        attachmentIds:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: integer
          description: "Optional ids of files previously uploaded via POST /uploads. They get included as context for the AI (text content for text/json/csv files, a one-line reference note for images/PDFs)."
      required:
        - prompt
    UpdateCoderModelRequest:
      type: object
      properties:
        coderModel:
          type: string
          description: "auto | gemini-2.5-flash | claude-4-7-sonnet-20260416"
      required:
        - coderModel
    UpdateAutoPublishRequest:
      type: object
      properties:
        autoPublish:
          type: boolean
      required:
        - autoPublish
    ImageGenerationResult:
      type: object
      properties:
        found:
          type: integer
          description: Number of placeholder URLs detected in the bundle (capped per call).
        generated:
          type: integer
          description: Number of real images successfully generated and stored.
        bundleUpdated:
          type: boolean
          description: True if the frontend bundle was rewritten to point at the new images.
      required: [found, generated, bundleUpdated]
    HealthCheckResult:
      type: object
      properties:
        ok:
          type: boolean
        fixed:
          type: boolean
          description: True if the bundle was patched and improved (or fully fixed).
        before:
          type: object
          properties:
            ok: { type: boolean }
            issuesCount: { type: integer }
          required: [ok, issuesCount]
        after:
          type: object
          properties:
            ok: { type: boolean }
            issuesCount: { type: integer }
          required: [ok, issuesCount]
      required: [ok, fixed, before, after]
    DeployResult:
      type: object
      properties:
        url:
          type: string
        slug:
          type: string
      required: [url, slug]
    VisualIssue:
      type: object
      properties:
        severity:
          type: string
          enum: [critical, major, minor]
        type:
          type: string
        viewport:
          type: string
        description:
          type: string
        suggestion:
          type: string
      required: [severity, type, viewport, description, suggestion]
    VisualAnalysis:
      type: object
      properties:
        visuallyCorrect:
          type: boolean
        overallScore:
          type: number
        issues:
          type: array
          items: { $ref: "#/components/schemas/VisualIssue" }
        positives:
          type: array
          items: { type: string }
        summary:
          type: string
      required: [visuallyCorrect, overallScore, issues, positives, summary]
    VisualScreenshot:
      type: object
      properties:
        viewport: { type: string }
        mimeType: { type: string }
        width: { type: integer }
        height: { type: integer }
        imageBase64:
          type: string
          description: "Raw base64 PNG (no data: prefix)"
        consoleErrors:
          type: array
          items: { type: string }
      required: [viewport, mimeType, width, height, imageBase64, consoleErrors]
    VisualTestReport:
      type: object
      properties:
        cycles: { type: integer }
        fixesApplied: { type: integer }
        analysis:
          $ref: "#/components/schemas/VisualAnalysis"
        screenshots:
          type: array
          items: { $ref: "#/components/schemas/VisualScreenshot" }
      required: [cycles, fixesApplied, analysis, screenshots]
    GitHubPushResult:
      type: object
      properties:
        url:
          type: string
        repoFullName:
          type: string
        updated:
          type: boolean
          description: |
            true → the existing repo received a new commit on `main`.
            false → a brand-new repo was created (first push, or previous
            repo was deleted on GitHub).
      required: [url, repoFullName, updated]
    SendAppMessageRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 2
        attachmentIds:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: integer
          description: "Optional ids of files previously uploaded via POST /uploads. They become AI context for this edit."
      required:
        - message
    SendAppMessageDirectResponse:
      type: object
      description: |
        Returned with HTTP 200 when the chat message did NOT require a
        regeneration. Happens when the intent classifier decides the user
        was asking a question about the app or asking for pure web
        research — both are answered inline without spending credits.
      properties:
        kind:
          type: string
          enum: [answered]
        intent:
          type: string
          enum: [question, research]
        reply:
          type: string
          description: The assistant's plain-text reply, already persisted as an app_message row.
      required:
        - kind
        - intent
        - reply
    AppMessage:
      type: object
      properties:
        id:
          type: integer
        appId:
          type: integer
        role:
          type: string
          description: user | assistant | system
        content:
          type: string
        attachmentIds:
          type: array
          items:
            type: integer
          description: "Ids of chat_attachments rows referenced by this message. Empty for messages sent without uploads. Use GET /uploads/:id to fetch the bytes."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - appId
        - role
        - content
        - attachmentIds
        - createdAt
    AgentNotes:
      type: object
      description: Persistent agent memory (per-app or per-user). Capped at 3000 chars.
      properties:
        notes:
          type: string
      required:
        - notes
    AppRevision:
      type: object
      description: A snapshot of an app at a point in time, used for rollback.
      properties:
        id:
          type: integer
        source:
          type: string
          description: create | edit | visual-fix | health-fix | restore-backup
        sourceLabel:
          type: string
          description: Friendly Spanish label for the source
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - source
        - sourceLabel
        - summary
        - createdAt
    AppRevisionList:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/AppRevision"
      required:
        - revisions
    Template:
      type: object
      description: A curated starter template (kind + seed prompt) for the dashboard.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: fullstack | mobile | landing | game-2d | game-3d | hybrid-pwa | vue | svelte | nextjs
        seedPrompt:
          type: string
        icon:
          type: string
          description: lucide-react icon name
      required:
        - id
        - name
        - description
        - kind
        - seedPrompt
        - icon
    TemplateList:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/Template"
      required:
        - templates
    VercelDeployResult:
      type: object
      properties:
        url:
          type: string
          description: Public URL Vercel assigned to this deployment
        projectId:
          type: string
          description: Vercel project id (reused across future deploys)
        deploymentId:
          type: string
          description: Vercel deployment id (visible in the user's dashboard)
      required:
        - url
        - projectId
        - deploymentId
    DnsRecord:
      type: object
      properties:
        type:
          type: string
          description: DNS record type (A or CNAME)
        name:
          type: string
          description: Host portion to set in the DNS zone (e.g. "@" for apex)
        value:
          type: string
          description: Target value of the record
      required: [type, name, value]
    CustomDomainStatus:
      type: object
      properties:
        domain:
          type: string
          nullable: true
          description: Custom domain currently attached, or null if none
        verified:
          type: boolean
          description: True once Vercel has confirmed DNS + ownership
        verification:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              domain:
                type: string
              value:
                type: string
              reason:
                type: string
        recommendedDns:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"
        spentCents:
          type: integer
          description: |
            User's lifetime EUR spend in cents. Informational only — the
            unlock gate no longer uses a spend threshold.
        requiredCents:
          type: integer
          description: |
            Deprecated. Always 0 since May 2026. The unlock rule is now
            "any paid purchase OR admin email", not a EUR threshold.
        unlocked:
          type: boolean
          description: |
            Whether this user can attach a custom domain to this app.
            True for admin emails OR users who have made any purchase.
        unlockReason:
          type: string
          enum: ["admin", "purchase"]
          nullable: true
          description: |
            How the user qualified for custom-domain access:
            "admin" = owner email, "purchase" = at least one paid plan,
            null = locked (free plan).
        warning:
          type: string
          description: Optional soft warning if Vercel API is briefly unreachable
    GenerationJob:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          description: queued | running | succeeded | failed
        phase:
          type: string
          description: queued | starting | researching | generating | parsing | ready | failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
        appId:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - phase
        - progress
        - createdAt
        - updatedAt
    JobLogEntry:
      type: object
      description: A single live log line emitted by an agent during generation.
      properties:
        id:
          type: integer
          description: Monotonic id; pass the highest seen value as `afterId` on the next poll.
        agent:
          type: string
          description: Originating agent (researcher | architect | designer | integration | coder | qa | validator | patcher | system).
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - agent
        - level
        - message
        - createdAt
    JobLogList:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/JobLogEntry"
      required:
        - logs
    AppRuntimeError:
      type: object
      description: A single JS error captured by the published app's iframe sandbox.
      properties:
        id:
          type: integer
        kind:
          type: string
          description: "error | unhandledrejection (matches the browser event name)."
        message:
          type: string
        source:
          type: string
          nullable: true
        lineno:
          type: integer
          nullable: true
        colno:
          type: integer
          nullable: true
        stack:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        pathname:
          type: string
          nullable: true
          description: "SPA route the visitor was on when the error fired."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - message
        - createdAt
    AppRuntimeErrorList:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AppRuntimeError"
      required:
        - errors
    CreditPackage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        credits:
          type: integer
        priceCents:
          type: integer
        currency:
          type: string
        priceId:
          type: string
        popular:
          type: boolean
      required:
        - id
        - name
        - description
        - credits
        - priceCents
        - currency
        - priceId
        - popular
    CreateCheckoutRequest:
      type: object
      properties:
        priceId:
          type: string
      required:
        - priceId
    CheckoutSession:
      type: object
      properties:
        url:
          type: string
        sessionId:
          type: string
      required:
        - url
        - sessionId
    ConfirmCheckoutRequest:
      type: object
      properties:
        sessionId:
          type: string
      required:
        - sessionId
    ConfirmCheckoutResult:
      type: object
      properties:
        creditsAdded:
          type: integer
        newBalance:
          type: integer
        alreadyProcessed:
          type: boolean
      required:
        - creditsAdded
        - newBalance
        - alreadyProcessed
    CreditTransaction:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        amount:
          type: integer
        kind:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amount
        - kind
        - description
        - createdAt
    AdminOverview:
      type: object
      properties:
        totalUsers:
          type: integer
        totalApps:
          type: integer
        appsLast7Days:
          type: integer
        creditsOutstanding:
          type: integer
        creditsSpentTotal:
          type: integer
        creditsPurchasedTotal:
          type: integer
        revenueCentsTotal:
          type: integer
      required:
        - totalUsers
        - totalApps
        - appsLast7Days
        - creditsOutstanding
        - creditsSpentTotal
        - creditsPurchasedTotal
        - revenueCentsTotal
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        credits:
          type: integer
        appsGenerated:
          type: integer
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - credits
        - appsGenerated
        - isAdmin
        - createdAt
    AdminApp:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        userEmail:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        techStack:
          type: array
          items:
            type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - description
        - techStack
        - status
        - createdAt
    AdjustCreditsRequest:
      type: object
      properties:
        delta:
          type: integer
          description: Positive to add credits, negative to remove
        reason:
          type: string
      required:
        - delta
    AdminJob:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        userEmail:
          type: string
          nullable: true
        appId:
          type: integer
          nullable: true
        editAppId:
          type: integer
          nullable: true
        prompt:
          type: string
        status:
          type: string
        phase:
          type: string
        progress:
          type: integer
        coderModel:
          type: string
        language:
          type: string
        retryCount:
          type: integer
        errorMessage:
          type: string
          nullable: true
        ageMs:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - prompt
        - status
        - phase
        - progress
        - coderModel
        - language
        - retryCount
        - ageMs
        - createdAt
        - updatedAt
    AdminJobsResponse:
      type: object
      properties:
        queued:
          type: integer
        running:
          type: integer
        failedLast24h:
          type: integer
        succeededLast24h:
          type: integer
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/AdminJob"
      required:
        - queued
        - running
        - failedLast24h
        - succeededLast24h
        - jobs
