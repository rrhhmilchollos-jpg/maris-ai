openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user / credits
  - name: apps
    description: Generated apps
  - name: generation
    description: AI app generation
  - name: billing
    description: Credit purchase / Stripe
  - name: admin
    description: Admin-only operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile and credits
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/stats:
    get:
      operationId: getMyStats
      tags: [me]
      summary: Get dashboard summary stats for current user
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: List the current user's generated apps
      responses:
        "200":
          description: List of apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedApp"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Get a specific generated app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Delete a generated app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generate:
    post:
      operationId: generateApp
      tags: [generation]
      summary: Enqueue an app generation job (cost depends on kind — fullstack/landing 1, mobile 2, hybrid-pwa 3, game-2d 3, game-3d 5; free for admins). If appId is provided, edits the existing app instead of creating a new one (always 1 credit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAppRequest"
      responses:
        "202":
          description: Generation job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/messages:
    get:
      operationId: listAppMessages
      tags: [apps]
      summary: List chat messages for an app (oldest first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppMessage"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: sendAppMessage
      tags: [apps]
      summary: Send a chat message that triggers an iterative regeneration of the app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAppMessageRequest"
      responses:
        "202":
          description: Edit job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/model:
    patch:
      operationId: updateAppModel
      tags: [apps]
      summary: Update the Coder model preference for an app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoderModelRequest"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "400":
          description: Invalid model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/export:
    get:
      operationId: exportApp
      tags: [apps]
      summary: Download the app source as a ZIP archive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ZIP archive of the app source
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/generate-images:
    post:
      operationId: generateAppImages
      tags: [apps]
      summary: Replace placeholder image URLs in the app bundle with real Nano Banana Pro images
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResult"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Image generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/healthcheck:
    post:
      operationId: healthCheckApp
      tags: [apps]
      summary: Validate the app bundle and auto-patch any detected issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResult"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/deploy:
    post:
      operationId: deployApp
      tags: [apps]
      summary: Publish the app to a public /p/{slug} URL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "400":
          description: Bundle could not be packaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/fork:
    post:
      operationId: forkApp
      tags: [apps]
      summary: Clone the app (frontend + backend code, model, language) into a brand-new app owned by the current user. Free — no credits charged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The newly-created copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApp"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/visual-test:
    post:
      operationId: visualTestApp
      tags: [apps]
      summary: Run the Visual Testing Agent (screenshots + Claude Vision + auto-fix). Costs 30 credits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Visual analysis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualTestReport"
        "400":
          description: Bundle could not be packaged for screenshotting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Visual testing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/{id}/github:
    post:
      operationId: pushAppToGitHub
      tags: [apps]
      summary: Create a new GitHub repo and push the app source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: GitHub repo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubPushResult"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generate/jobs/{id}:
    get:
      operationId: getGenerationJob
      tags: [generation]
      summary: Poll the status of a generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generate/jobs/{id}/logs:
    get:
      operationId: getGenerationJobLogs
      tags: [generation]
      summary: Stream live agent log lines for a job
      description: |
        Returns log lines emitted by individual agents (researcher, architect,
        designer, integration, coder, qa, validator, patcher, system) during
        the generation pipeline. Pass `afterId` to fetch only lines newer than
        the last id you've seen — the dashboard polls this endpoint every
        ~1.2s while a job is running so the user sees the agents' real-time
        output.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: afterId
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: New log lines since afterId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogList"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /billing/packages:
    get:
      operationId: listCreditPackages
      tags: [billing]
      summary: List available credit packages
      responses:
        "200":
          description: Available packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPackage"
  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session for a credit package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /billing/transactions:
    get:
      operationId: listTransactions
      tags: [billing]
      summary: List the current user's recent credit transactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTransaction"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /billing/confirm:
    post:
      operationId: confirmCheckout
      tags: [billing]
      summary: Confirm a Stripe checkout session and credit the user (called after redirect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCheckoutRequest"
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmCheckoutResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Global stats and recent activity for the admin panel
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with their stats
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{id}/credits:
    post:
      operationId: adjustUserCredits
      tags: [admin]
      summary: Add or remove credits from a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCreditsRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/apps:
    get:
      operationId: listAdminApps
      tags: [admin]
      summary: List all generated apps across all users
      responses:
        "200":
          description: List of apps with owner info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminApp"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin]
      summary: Recent generation jobs across all users (queue health view)
      responses:
        "200":
          description: List of jobs with owner info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobsResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/jobs/{id}/retry:
    post:
      operationId: retryAdminJob
      tags: [admin]
      summary: Re-enqueue a failed (or stuck) generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job re-enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Job is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        credits:
          type: integer
        appsGenerated:
          type: integer
        isAdmin:
          type: boolean
        isPremium:
          type: boolean
        lifetimeCreditsPurchased:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - credits
        - appsGenerated
        - isAdmin
        - createdAt
    DashboardStats:
      type: object
      properties:
        credits:
          type: integer
        appsGenerated:
          type: integer
        appsThisWeek:
          type: integer
        creditsSpentTotal:
          type: integer
        recentApps:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedApp"
      required:
        - credits
        - appsGenerated
        - appsThisWeek
        - creditsSpentTotal
        - recentApps
    GeneratedApp:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        prompt:
          type: string
        description:
          type: string
        techStack:
          type: array
          items:
            type: string
        frontendCode:
          type: string
        backendCode:
          type: string
        status:
          type: string
        coderModel:
          type: string
          description: "Coder model preference: auto | gemini-2.5-flash | claude-sonnet-4-6"
        language:
          type: string
          description: "Source language: typescript (.tsx) or javascript (.jsx). Locked at creation."
        publicSlug:
          type: string
          nullable: true
          description: When set, the app is publicly viewable at /p/{publicSlug}.
        githubRepoUrl:
          type: string
          nullable: true
          description: HTML URL of the repo this app was last pushed to.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - prompt
        - description
        - techStack
        - frontendCode
        - backendCode
        - status
        - coderModel
        - language
        - createdAt
    GenerateAppRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 5
        appId:
          type: integer
          nullable: true
          description: When provided, edits the existing app iteratively instead of creating a new one
        coderModel:
          type: string
          nullable: true
          description: "Coder model for the new app. One of: auto | gemini-2.5-flash | claude-sonnet-4-6. Ignored on edits."
        language:
          type: string
          nullable: true
          description: "Source language for the new app: typescript | javascript. Default typescript. Ignored on edits (the app's stored value wins)."
        kind:
          type: string
          nullable: true
          enum: [fullstack, mobile, landing, "game-2d", "game-3d", "hybrid-pwa"]
          description: "Project kind preset. Drives the architect's INTENT directive and the credit cost (fullstack/landing 1, mobile 2, hybrid-pwa 3, game-2d 3, game-3d 5). Ignored on edits — they always cost 1 credit and inherit the app's original characteristics."
        attachmentIds:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: integer
          description: "Optional ids of files previously uploaded via POST /uploads. They get included as context for the AI (text content for text/json/csv files, a one-line reference note for images/PDFs)."
      required:
        - prompt
    UpdateCoderModelRequest:
      type: object
      properties:
        coderModel:
          type: string
          description: "auto | gemini-2.5-flash | claude-sonnet-4-6"
      required:
        - coderModel
    ImageGenerationResult:
      type: object
      properties:
        found:
          type: integer
          description: Number of placeholder URLs detected in the bundle (capped per call).
        generated:
          type: integer
          description: Number of real images successfully generated and stored.
        bundleUpdated:
          type: boolean
          description: True if the frontend bundle was rewritten to point at the new images.
      required: [found, generated, bundleUpdated]
    HealthCheckResult:
      type: object
      properties:
        ok:
          type: boolean
        fixed:
          type: boolean
          description: True if the bundle was patched and improved (or fully fixed).
        before:
          type: object
          properties:
            ok: { type: boolean }
            issuesCount: { type: integer }
          required: [ok, issuesCount]
        after:
          type: object
          properties:
            ok: { type: boolean }
            issuesCount: { type: integer }
          required: [ok, issuesCount]
      required: [ok, fixed, before, after]
    DeployResult:
      type: object
      properties:
        url:
          type: string
        slug:
          type: string
      required: [url, slug]
    VisualIssue:
      type: object
      properties:
        severity:
          type: string
          enum: [critical, major, minor]
        type:
          type: string
        viewport:
          type: string
        description:
          type: string
        suggestion:
          type: string
      required: [severity, type, viewport, description, suggestion]
    VisualAnalysis:
      type: object
      properties:
        visuallyCorrect:
          type: boolean
        overallScore:
          type: number
        issues:
          type: array
          items: { $ref: "#/components/schemas/VisualIssue" }
        positives:
          type: array
          items: { type: string }
        summary:
          type: string
      required: [visuallyCorrect, overallScore, issues, positives, summary]
    VisualScreenshot:
      type: object
      properties:
        viewport: { type: string }
        mimeType: { type: string }
        width: { type: integer }
        height: { type: integer }
        imageBase64:
          type: string
          description: "Raw base64 PNG (no data: prefix)"
        consoleErrors:
          type: array
          items: { type: string }
      required: [viewport, mimeType, width, height, imageBase64, consoleErrors]
    VisualTestReport:
      type: object
      properties:
        cycles: { type: integer }
        fixesApplied: { type: integer }
        analysis:
          $ref: "#/components/schemas/VisualAnalysis"
        screenshots:
          type: array
          items: { $ref: "#/components/schemas/VisualScreenshot" }
      required: [cycles, fixesApplied, analysis, screenshots]
    GitHubPushResult:
      type: object
      properties:
        url:
          type: string
        repoFullName:
          type: string
      required: [url, repoFullName]
    SendAppMessageRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 2
        attachmentIds:
          type: array
          nullable: true
          maxItems: 10
          items:
            type: integer
          description: "Optional ids of files previously uploaded via POST /uploads. They become AI context for this edit."
      required:
        - message
    AppMessage:
      type: object
      properties:
        id:
          type: integer
        appId:
          type: integer
        role:
          type: string
          description: user | assistant | system
        content:
          type: string
        attachmentIds:
          type: array
          items:
            type: integer
