<text x="600" y="293" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="500" fill="#e2e8f0">con inteligencia artificial</text>

<text x="600" y="335" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">Genera apps completas en minutos.</text>
<text x="600" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">Menos creditos. Mas potencia. Tu codigo.</text>

