<text x="170" y="266" font-family="monospace" font-size="11" fill="#a78bfa">// minimo</text>
<text x="80" y="284" font-family="monospace" font-size="11" fill="#e2e8f0">})</text>
<text x="80" y="310" font-family="monospace" font-size="11" fill="#64748b">// Frontend listo</text>
<text x="80" y="325" font-family="monospace" font-size="11" fill="#64748b">// Backend listo</text>

