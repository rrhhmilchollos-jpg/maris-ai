<text x="836" y="296" font-family="sans-serif" font-size="11" fill="#94a3b8"> APK + IPA nativo incluido</text>
<text x="820" y="314" font-family="sans-serif" font-size="11" fill="#34d399">+</text>
<text x="836" y="314" font-family="sans-serif" font-size="11" fill="#94a3b8"> Frontend + Backend + DB</text>
<text x="820" y="332" font-family="sans-serif" font-size="11" fill="#34d399">+</text>
<text x="836" y="332" font-family="sans-serif" font-size="11" fill="#94a3b8"> 100% tu codigo, sin ataduras</text>

