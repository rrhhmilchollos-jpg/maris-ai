<svg width="100%" viewBox="0 0 1200 675" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Maris AI - La nueva era del desarrollo con IA</title>
<desc>Imagen de portada para Google News de Maris AI</desc>
<defs>
