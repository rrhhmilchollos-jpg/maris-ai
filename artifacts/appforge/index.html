    body{background-color:hsl(240 10% 4%);color:hsl(0 0% 98%);margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;}
    #root{min-height:100vh;min-height:100dvh;}
    /* Animaciones GPU-composited — solo transform y opacity para evitar reflows */
    @keyframes marisBlob{0%,100%{opacity:.8;transform:scale(1) translateZ(0)}50%{opacity:1;transform:scale(1.05) translateZ(0)}}
    @keyframes marisFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    /* Skeleton loader para LCP — evita layout shift mientras carga React.
       ENCONTRADO A PETICIÓN DEL USUARIO (investigación de fricción móvil):
       100vh no tiene en cuenta la barra de direcciones del navegador en
       móvil (Safari/Chrome iOS especialmente) -- puede dejar contenido
       cortado o espacio en blanco extraño. 100dvh (altura dinámica de
       viewport) sí lo tiene en cuenta; 100vh se mantiene como respaldo
       para navegadores que no soporten dvh todavía. */
    #root:empty::after{content:"";display:block;min-height:100vh;min-height:100dvh;background:hsl(240 10% 4%);}
    /* Preload hint visual para FCP */
    .maris-hero-skeleton{background:linear-gradient(135deg,hsl(240 10% 6%) 0%,hsl(240 10% 8%) 100%);min-height:100vh;min-height:100dvh;}
    /* Evitar FOIT — mostrar texto con font del sistema hasta que cargue Inter */
    @font-face{font-family:'Inter';font-display:swap;}
    /* Reemplaza Framer Motion — CSS puro, cero JS bloqueante */
    @keyframes marisFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .maris-fade-in{animation:marisFadeIn 0.5s ease forwards;}
    .maris-fade-in:nth-child(2){animation-delay:0.1s}
    .maris-fade-in:nth-child(3){animation-delay:0.2s}
    .maris-fade-in:nth-child(4){animation-delay:0.3s}
    /* Mejorar INP — reducir trabajo del hilo principal */
    *{contain-intrinsic-size:auto;}
    img,video{content-visibility:auto;}
  </style>

  
  
</head>
