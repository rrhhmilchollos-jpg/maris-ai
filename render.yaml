services:
  # ============================================================================
  # API Server (Web Service)
  # ============================================================================
  - type: web
    name: maris-ai-api-server
    env: node
    region: oregon
    plan: starter # Escalar según demanda
    buildCommand: cd artifacts/api-server && npm install && npm run build
    startCommand: cd artifacts/api-server && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_BASE_PATH
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false # URL de Redis para BullMQ
      - key: GITHUB_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: JOB_CONCURRENCY
        value: "3" # Concurrencia en el API server

  # ============================================================================
  # BullMQ Worker Service (Background Job Processing)
  # ============================================================================
  # Este servicio procesa trabajos de generación de apps en paralelo.
  # Puedes escalar horizontalmente agregando más instancias de este worker.
  # ============================================================================
  - type: worker
    name: maris-ai-worker
    env: node
    region: oregon
    plan: starter # Escalar según demanda
    buildCommand: cd artifacts/api-server && npm install && npm run build
    startCommand: cd artifacts/api-server && npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false # URL de Redis para BullMQ (debe ser la misma que en el API)
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: JOB_CONCURRENCY
        value: "10" # Concurrencia en el worker (aumenta para más paralelismo)
      - key: LOG_LEVEL
        value: info
