services:
  # ============================================================================
  # API Server (Web Service)
  # ============================================================================
  - type: web
    name: maris-ai-api-server
    env: node
    region: oregon
    plan: starter # Escalar según demanda
    buildCommand: npm install -g pnpm@10.11.0 && pnpm install --no-frozen-lockfile && cd artifacts/api-server && pnpm run build
    startCommand: cd artifacts/api-server && pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: ZOCOIA_API_URL
        value: "https://zocoia.es"
      - key: ZOCOIA_API_KEY
        sync: false
      - key: FRONTEND_BASE_PATH
        value: "/"
      - key: FRONTEND_URL
        value: "https://marisai.es"
      - key: WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false # URL de Redis para BullMQ
      - key: GITHUB_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: JOB_CONCURRENCY
        value: "3" # Concurrencia en el API server
      - key: VERCEL_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  # ============================================================================
  # Worker Service (Background Job Processing)
  # ============================================================================
  # Este servicio procesa trabajos de generación de apps en paralelo.
  # Puedes escalar horizontalmente agregando más instancias de este worker.
  # ============================================================================
  - type: worker
    name: maris-ai-worker
    env: node
    region: oregon
    plan: starter # Escalar según demanda
    buildCommand: npm install -g pnpm@10.11.0 && pnpm install --no-frozen-lockfile && cd artifacts/api-server && pnpm run build
    startCommand: cd artifacts/api-server && pnpm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false # URL de Redis para BullMQ (debe ser la misma que en el API)
      - key: ZOCOIA_API_URL
        value: "https://zocoia.es"
      - key: ZOCOIA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: JOB_CONCURRENCY
        value: "10" # Concurrencia en el worker (aumenta para más paralelismo)
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
